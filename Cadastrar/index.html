<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | CRUD Operations</title><link rel="stylesheet" href="../Login/index.css"><link rel="stylesheet" href="index.css"></head><body><main class="auth-layout"><section class="auth-hero"><div class="hero-brand"><span>◆</span> CRUD Operations</div><div><p class="eyebrow">Comece agora</p><h1>Sua gestão mais organizada.</h1><p>Crie sua conta para acessar a experiência administrativa do CRUD Operations.</p></div><small>© 2026 CRUD Operations</small></section><section class="auth-panel"><form id="registerForm" class="auth-card"><div class="mobile-brand">◆ CRUD Operations</div><p class="eyebrow">Nova conta</p><h2>Crie seu acesso</h2><p class="subcopy">Preencha os dados abaixo para continuar.</p><label>Nome completo<input type="text" id="nome" required autocomplete="name" maxlength="100" placeholder="Seu nome"></label><label>E-mail<input type="email" id="email" required autocomplete="email" placeholder="seu@email.com"></label><label>Senha<input type="password" id="senha" required minlength="6" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></label><label>Data de nascimento<input type="date" id="nascimento" required></label><p class="form-error" id="registerError" role="alert"></p><button type="submit">Criar conta</button><p class="signup">Já possui conta? <a href="../Login/index.html">Entrar</a></p></form></section></main><script src="../assets/app.js"></script><script src="index.js"></script></body></html>
