<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursos | CRUD Operations</title><link rel="stylesheet" href="../assets/app.css"></head>
<body data-page="cursos"><div class="app-shell"><aside class="sidebar" data-sidebar></aside><div class="sidebar-overlay" data-sidebar-overlay></div><main class="main">
<header class="topbar"><button class="mobile-menu" data-menu-toggle aria-label="Abrir menu"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="page-heading"><h1>Cursos</h1><p>Organize o catálogo de cursos disponíveis.</p></div></header>
<div class="page-actions"><label class="search-field"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" data-search placeholder="Pesquisar cursos..."></label><button class="btn btn-primary" data-add><span>＋</span>Novo curso</button></div>
<section class="panel table-panel"><div class="table-scroll"><table data-table><thead><tr><th>Curso</th><th>Categoria</th><th>Carga horária</th><th>Status</th><th aria-label="Ações"></th></tr></thead><tbody data-table-body></tbody></table><div class="empty-state" data-empty hidden><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16l2 10v6H2v-6z"/><path d="M2 14h5l2 3h6l2-3h5"/></svg><div><strong>Nenhum curso encontrado</strong><span>Cadastre um curso ou altere os termos da pesquisa.</span></div></div></div><footer class="table-footer"><span data-count>0 registros</span><div class="pagination" data-pagination></div></footer></section>
</main></div><dialog id="recordDialog"><form id="recordForm"><div class="modal-head"><h2 data-modal-title>Novo curso</h2><button type="button" class="icon-btn" data-close-modal aria-label="Fechar">✕</button></div><div class="modal-body"><div class="form-grid">
<div class="field full"><label for="nome">Nome do curso</label><input id="nome" name="nome" required maxlength="100" placeholder="Ex.: Desenvolvimento Web"></div><div class="field"><label for="categoria">Categoria</label><input id="categoria" name="categoria" required maxlength="60" placeholder="Ex.: Tecnologia"></div><div class="field"><label for="cargaHoraria">Carga horária</label><input id="cargaHoraria" name="cargaHoraria" type="number" min="1" required placeholder="40"></div><div class="field"><label for="status">Status</label><select id="status" name="status" required><option>Ativo</option><option>Inativo</option></select></div><div class="field"><label for="inicio">Data de início</label><input id="inicio" name="inicio" type="date"></div>
</div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button><button type="submit" class="btn btn-primary" data-submit>Salvar curso</button></div></form></dialog><script src="../assets/app.js"></script><script src="index.js"></script></body></html>
