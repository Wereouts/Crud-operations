<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamentos | CRUD Operations</title><link rel="stylesheet" href="../assets/app.css"></head>
<body data-page="pagamentos"><div class="app-shell"><aside class="sidebar" data-sidebar></aside><div class="sidebar-overlay" data-sidebar-overlay></div><main class="main">
  <header class="topbar"><button class="mobile-menu" data-menu-toggle aria-label="Abrir menu"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="page-heading"><h1>Pagamentos</h1><p>Registre e acompanhe as movimentações financeiras.</p></div></header>
  <div class="page-actions"><label class="search-field"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" data-search placeholder="Pesquisar pagamentos..."></label><button class="btn btn-primary" data-add><span>＋</span>Registrar pagamento</button></div>
  <section class="panel table-panel"><div class="table-scroll"><table data-table><thead><tr><th>Responsável</th><th>Descrição</th><th>Valor</th><th>Status</th><th>Data</th><th aria-label="Ações"></th></tr></thead><tbody data-table-body></tbody></table><div class="empty-state" data-empty hidden><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16l2 10v6H2v-6z"/><path d="M2 14h5l2 3h6l2-3h5"/></svg><div><strong>Nenhum pagamento encontrado</strong><span>Registre um pagamento ou altere os termos da pesquisa.</span></div></div></div><footer class="table-footer"><span data-count>0 registros</span><div class="pagination" data-pagination></div></footer></section>
</main></div>
<dialog id="recordDialog"><form id="recordForm"><div class="modal-head"><h2 data-modal-title>Registrar pagamento</h2><button type="button" class="icon-btn" data-close-modal aria-label="Fechar">✕</button></div><div class="modal-body"><div class="form-grid">
  <div class="field full"><label for="responsavel">Responsável</label><input id="responsavel" name="responsavel" required maxlength="100" placeholder="Nome do responsável"></div>
  <div class="field full"><label for="descricao">Descrição</label><input id="descricao" name="descricao" required maxlength="120" placeholder="Ex.: Mensalidade de novembro"></div>
  <div class="field"><label for="valor">Valor (R$)</label><input id="valor" name="valor" type="number" step="0.01" min="0.01" required placeholder="0,00"></div>
  <div class="field"><label for="status">Status</label><select id="status" name="status" required><option value="">Selecione</option><option>Pendente</option><option>Pago</option><option>Cancelado</option></select></div>
  <div class="field"><label for="data">Data</label><input id="data" name="data" type="date" required></div>
  <div class="field"><label for="documento">Número do documento</label><input id="documento" name="documento" maxlength="40" placeholder="Opcional"></div>
</div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button><button type="submit" class="btn btn-primary" data-submit>Salvar pagamento</button></div></form></dialog>
<script src="../assets/app.js"></script><script src="index.js"></script></body></html>
