<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários | CRUD Operations</title><link rel="stylesheet" href="../assets/app.css"></head>
<body data-page="usuarios"><div class="app-shell"><aside class="sidebar" data-sidebar></aside><div class="sidebar-overlay" data-sidebar-overlay></div><main class="main">
<header class="topbar"><button class="mobile-menu" data-menu-toggle aria-label="Abrir menu"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="page-heading"><h1>Usuários</h1><p>Gerencie acessos e perfis do sistema.</p></div></header>
<div class="page-actions"><label class="search-field"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" data-search placeholder="Pesquisar por nome, e-mail ou perfil..."></label><button class="btn btn-primary" data-add><span>＋</span>Novo usuário</button></div>
<section class="panel table-panel"><div class="table-scroll"><table data-table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Telefone</th><th aria-label="Ações"></th></tr></thead><tbody data-table-body></tbody></table><div class="empty-state" data-empty hidden><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16l2 10v6H2v-6z"/><path d="M2 14h5l2 3h6l2-3h5"/></svg><div><strong>Nenhum usuário encontrado</strong><span>Cadastre um usuário ou altere os termos da pesquisa.</span></div></div></div><footer class="table-footer"><span data-count>0 registros</span><div class="pagination" data-pagination></div></footer></section>
</main></div><dialog id="recordDialog"><form id="recordForm"><div class="modal-head"><h2 data-modal-title>Novo usuário</h2><button type="button" class="icon-btn" data-close-modal aria-label="Fechar">✕</button></div><div class="modal-body"><div class="form-grid">
<div class="field full"><label for="nome">Nome completo</label><input id="nome" name="nome" required maxlength="100" autocomplete="name" placeholder="Nome do usuário"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="nome@exemplo.com"></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"></div><div class="field"><label for="perfil">Perfil</label><select id="perfil" name="perfil" required><option value="">Selecione</option><option>Usuário</option><option>Administrador</option></select></div><div class="field"><label for="status">Status</label><select id="status" name="status" required><option>Ativo</option><option>Inativo</option></select></div>
</div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button><button type="submit" class="btn btn-primary" data-submit>Salvar usuário</button></div></form></dialog><script src="../assets/app.js"></script><script src="index.js"></script></body></html>
